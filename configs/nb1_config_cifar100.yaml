# =============================================================================
# nb1_config_cifar100.yaml
# NB1 configuration for CIFAR-100 / ResNet-18.
# Paper reference: §A.3 (single-class: {0,1,2,3,5}), Table 4, §A.4.
# =============================================================================

# ---------------------------------------------------------------------------
# Experiment identity
# ---------------------------------------------------------------------------
experiment_name: "cifar100_resnet18"
suffix: ""                       # e.g. "_seed012" or "_ablation_noWU"

# ---------------------------------------------------------------------------
# Dataset & architecture
# ---------------------------------------------------------------------------
dataset:   "cifar100"            # 100 classes, 50 000 train / 10 000 test
arch:      "resnet18"            # paper: ResNet-18 on CIFAR-100
data_path: "./data"

# ---------------------------------------------------------------------------
# Protocol
# ---------------------------------------------------------------------------
# §A.3: single-class unlearning — paper evaluates representative classes
# {0, 1, 2, 3, 5} (selected to cover different coarse super-classes; classes
# 1 and 4 share a coarse class so only one is used).
# Set to null to sweep ALL 100 classes instead.
forget_classes: [0, 1, 2, 3, 5]

# One seed for a single run; extend to [0, 1, 2] for multi-seed results.
SEEDS: [0]

# ---------------------------------------------------------------------------
# Test / CI mode  (set true for a fast smoke-test, adds "_test" suffix)
# ---------------------------------------------------------------------------
TEST_MODE: false
TEST_EPOCHS_SCALE: 0.1

# ---------------------------------------------------------------------------
# Output directories
# ---------------------------------------------------------------------------
pretrain_dir: "./checkpoints/pretrain"
splits_dir:   "./checkpoints/splits"
results_dir:  "./results"

# ---------------------------------------------------------------------------
# DataLoader settings  (Table 4: batch=128)
# ---------------------------------------------------------------------------
batch_size:      128
test_batch_size: 256
num_workers:     4

# ---------------------------------------------------------------------------
# Hyperparameter overrides  (null → paper_hparams.PRETRAIN_CFG defaults)
# Paper defaults for CIFAR-100: lr=0.01, epochs=300, wd=5e-4, warmup=5
# (same as CIFAR-10 — no override needed)
# ---------------------------------------------------------------------------
hparam_overrides:
  # epochs: 50            # ablation: shorten training
  # warmup_epochs: 0      # ablation: no warmup
