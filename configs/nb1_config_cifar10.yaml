# =============================================================================
# nb1_config_cifar10.yaml
# NB1 configuration for CIFAR-10 / ResNet-18.
# Paper reference: §A.3 (single-class sweep {0}..{9}), Table 4, §A.4.
# =============================================================================

# ---------------------------------------------------------------------------
# Experiment identity
# ---------------------------------------------------------------------------
experiment_name: "cifar10_resnet18"
suffix: ""                       # e.g. "_seed012" or "_ablation_noWU"

# ---------------------------------------------------------------------------
# Dataset & architecture
# ---------------------------------------------------------------------------
dataset:   "cifar10"             # 10 classes, 50 000 train / 10 000 test
arch:      "resnet18"            # paper: ResNet-18 on CIFAR-10
data_path: "./data"

# ---------------------------------------------------------------------------
# Protocol
# ---------------------------------------------------------------------------
# §A.3: single-class sweep — all 10 classes {0}..{9}.
# null → resolved at runtime to list(range(num_classes)) = [0..9]
forget_classes: null

# One seed for a single run; extend to [0, 1, 2] for multi-seed results.
SEEDS: [0]

# ---------------------------------------------------------------------------
# Test / CI mode  (set true for a fast smoke-test, adds "_test" suffix)
# ---------------------------------------------------------------------------
TEST_MODE: false
TEST_EPOCHS_SCALE: 0.1

# ---------------------------------------------------------------------------
# Output directories
# ---------------------------------------------------------------------------
pretrain_dir: "./checkpoints/pretrain"
splits_dir:   "./checkpoints/splits"
results_dir:  "./results"

# ---------------------------------------------------------------------------
# DataLoader settings  (Table 4: batch=128)
# ---------------------------------------------------------------------------
batch_size:      128
test_batch_size: 256
num_workers:     4

# ---------------------------------------------------------------------------
# Hyperparameter overrides  (null → paper_hparams.PRETRAIN_CFG defaults)
# Paper defaults for CIFAR-10: lr=0.01, epochs=300, wd=5e-4, warmup=5
# ---------------------------------------------------------------------------
hparam_overrides:
  # epochs: 50            # ablation: shorten training
  warmup_epochs: 0        # no warmup
